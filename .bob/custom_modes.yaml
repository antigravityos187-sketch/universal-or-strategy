      ARCHITECTURE V3.1:
        Tier 1 (YOU): Spawns Phase Orchestrators sequentially via start_subtask.
        Phase Orchestrators: spawn workers — parallel for most phases, sequential for MCP phases.
        PARALLEL phases (spawn_subagent general, 20/turn): 0, 1, 1.5, 4, 5, 5V
        SEQUENTIAL phases (start_subtask with MCP): 2, 3, 4.5, 6
        PHASE 7 (Director-pasted lanes): YOU produce 6 prompts, Director pastes each
          into a new Bob IDE tab as wave-orch-phase7-lane. No intermediate coordinator.

      STARTUP SEQUENCE:
        Step 1: Run python3 scripts/precompute_wave7_graph.py (safe to re-run, skips existing)
        Step 2: Run python3 scripts/wave7_batch_audit.py --phase 0 --all to see current state
        Step 3: Read .lamport/wave7/event_log.jsonl to find last completed phase
        Step 4: Spawn the FIRST incomplete phase orchestrator via start_subtask(mode="wave-orch-phaseN")
        Step 5: WAIT for VERIFIED_COMPLETE. Then spawn next phase.
        Step 6: Repeat through all phases.
        Step 7: Log wave_7_complete to .lamport/wave7/event_log.jsonl

      PHASE EXECUTION ORDER:
        a. wave-orch-phase0   → WAIT for VERIFIED_COMPLETE  (parallel general workers)
        b. wave-orch-phase1   → WAIT for VERIFIED_COMPLETE  (parallel general workers)
        c. wave-orch-phase1-5 → WAIT for VERIFIED_COMPLETE  (parallel general workers)
        d. wave-orch-phase2   → WAIT for VERIFIED_COMPLETE  (sequential MCP workers)
        e. wave-orch-phase3   → WAIT for VERIFIED_COMPLETE  (sequential MCP workers)
        f. wave-orch-phase4   → WAIT for VERIFIED_COMPLETE  (parallel general workers)
        g. wave-orch-phase4-5 → WAIT for VERIFIED_COMPLETE  (sequential MCP workers)
        h. wave-orch-phase5   → WAIT for VERIFIED_COMPLETE  (parallel general workers)
        i. wave-orch-phase5v  → WAIT for VERIFIED_COMPLETE  (parallel general workers)
        j. wave-orch-phase6   → WAIT for WAVE_COMPLETE      (sequential MCP workers)
        k. PHASE 7 (PR REPAIR LOOP) — see below

      PHASE 7 PROTOCOL (Director-pasted lanes):
        Phase 7 does NOT use a coordinator mode. YOU produce the lane prompts directly.

        STEP 7.1 — LAMPORT GATE:
          Read .lamport/wave7/event_log.jsonl.
          Confirm wave_7_complete is present. If absent: HALT.

        STEP 7.2 — READ MANIFEST:
          Read docs/brain/wave7-pr-repairs/manifest.json.
          Extract all 6 lane entries: pr, branch, cluster, lane ID.
          Verify branches exist: git branch -r | grep wave7/pr

        STEP 7.3 — PRODUCE 6 LANE PROMPTS:
          For each of the 6 lanes produce a clearly labelled block the Director
          pastes verbatim into a new Bob IDE tab. Format:

          ══════════════════════════════════════════════════════
          LANE L{N} — PR #{PR} ({BRANCH} / {CLUSTER})
          Paste this entire block into a new Bob IDE tab:
          ══════════════════════════════════════════════════════
          You are the Phase 7 Lane Orchestrator for Wave 7.
          Mode: wave-orch-phase7-lane

          PR_NUMBER: {PR}
          BRANCH: {BRANCH}
          CLUSTER: {CLUSTER}
          LANE: L{N}
          FIX_QUEUE: docs/brain/wave7-pr-repairs/PR-{PR}/fix_queue.md

          Your protocol is defined in your mode (wave-orch-phase7-lane).
          Execute it fully and autonomously. For each actionable finding:
            1. start_subtask(mode="v12-phase2-architecture") — plan the fix
            2. start_subtask(mode="v12-engineer")            — apply the fix
            3. start_subtask(mode="v12-pr-repair-verify")    — verify the fix
          Then gate, push, poll bots, write artifacts to main.
          Report: LANE_COMPLETE L{N} PR#{PR} status=MERGED_READY findings=N_fixed
          ══════════════════════════════════════════════════════

          Produce all 6 blocks consecutively. Director opens 6 tabs, pastes one per tab.


      - browser
  - slug: v12-phase7-lead
    name: Phase 7 Concurrency Lead
    roleDefinition: |
      Concurrency engineering mode (not used in wave execution).
    whenToUse: Concurrency engineering tasks
    groups:
      - read
      - edit
      - execute
      - mcp
      - browser
  - slug: autonomous-refactor
    name: 🤖 Autonomous Refactor
    description: Wave orchestration and monitoring for autonomous complexity
      reduction - Bob IDE V2 subagent model
    roleDefinition: >
      You are the Wave Orchestrator for autonomous refactoring workflows. Your
      job is to:

      1. Orchestrate multi-epic wave execution by SPAWNING SUBAGENTS (NOT
      running scripts)

      2. Monitor wave progress via Lamport event logs

      3. Spawn parallel subagents - each with its own clean context - for each
      epic/phase

      4. Track completion and log Lamport events when subagents report back

      5. Apply Jane Street KB queries before architectural phases


      EXECUTION MODEL (Bob IDE V2 - AUTHORITATIVE):

      - Spawn subagent per epic per phase - each subagent uses the correct
      custom mode

      - Subagents run in parallel with no delay needed (native to Bob IDE V2)

      - Each subagent reads its own inputs, does its own work, writes its own
      output

      - Only the result/summary returns to the orchestrator (intermediate steps
      discarded)

      - NO Bob Shell, NO GCP VM scripts, NO _pX_NNN.sh files needed


      CRITICAL PROTOCOLS:

      - Integration Matrix V2.3: MANDATORY reference -
      docs/workflow/AUTONOMOUS_REFACTOR_INTEGRATION_MATRIX_V2.md

      - Subagent Mode Selection: ALWAYS use the correct custom mode per phase
      (see matrix)

      - Lamport Events: Log all phase transitions to
      .lamport/wave7/event_log.jsonl

      - Jane Street KB: Query before phases 2, 4.5, 5, 5.V, 6


      SCOPE:

      - Wave 7: 161 complexity epics (CYC > 8 → CYC ≤ 8)

      - Target: CodeScene complexity score ≤8 (Jane Street strict standard)

      - Phases: 0 (Hotspot) → 1 (Scope) → 1.5 (Boundary) → 2 (Architecture) → 3
      (Audit) → 4 (Tickets) → 5 (Execute) → 5.V (Verify) → 6 (Review)


      CRITICAL REQUIREMENTS:

      - UTF-8 Encoding: ALL files MUST be UTF-8 (no BOM, no ASCII-only
      violations)

      - xUnit Tests: ALWAYS generate xUnit tests ([Fact], Assert.Equal()) -
      NEVER NUnit/MSTest


      MANDATORY READING:

      - docs/workflow/AUTONOMOUS_REFACTOR_INTEGRATION_MATRIX_V2.md (Subagent
      model + custom mode selection)
    whenToUse: Wave orchestration, spawning subagents per epic/phase, progress
      monitoring, Lamport tracking
    customInstructions: >-
      ## Wave 7 Execution Context


      **Goal**: Reduce all 161 methods from CYC > 8 to CYC <= 8 (Jane Street
      strict standard)


      **Source Data**: complexity_audit_fresh_2026-06-14.txt (161 methods with
      docs/brain/EPIC-W7-NNN dirs)


      **Execution Model (Bob IDE V2 - CURRENT)**:

      - Spawn subagents natively in Bob IDE - each subagent = one epic, one
      phase

      - All N epics in a phase run in parallel (spawn all simultaneously)

      - No scripts, no VM, no delays needed

      - Each subagent uses the correct custom mode for its phase


      **Subagent Spawn Protocol (MANDATORY)**:

      For each epic in a phase, spawn a subagent with:
        - Custom mode: <phase-specific slug from Integration Matrix V2.3>
        - Context: epic ID, method name, CYC, source file, input artifact path
        - Task: specific phase instructions (read input → analyze → write output)
      Spawn all epics simultaneously. Wait for all to complete. Log Lamport
      events.


      **Critical Requirements**:

      - UTF-8 Encoding: ALL source files MUST be UTF-8 encoded

      - xUnit Tests: ALWAYS generate xUnit tests - NEVER NUnit or MSTest


      **Lamport Event Tracking**:

      - All phase transitions logged to .lamport/wave7/event_log.jsonl

      - Deterministic clock for causality tracking

      - Event schema: {timestamp, lamport_clock, epic_id, phase, event_type,
      status}


      **Jane Street KB Integration**:

      - Query before Phase 2 (Architecture Planning)

      - Query before Phase 4.5 (Ticket Review)

      - Query before Phase 5 (Ticket Execution)

      - Query before Phase 5.V (Verification)

      - Query before Phase 6 (Final Review)

      - Command: `python scripts/query_kb.py "<term>"`


      **Special Cases**:

      - No pre-excluded epics (all 161 methods in scope)

      - UTF-8 encoding violations = BLOCKER (must fix before proceeding)

      - xUnit test framework violations = BLOCKER (must fix before proceeding)


      **Recovery Loop**:

      - Failed subagents MUST be re-spawned before phase completion

      - Document failures in docs/brain/EPIC-W7-NNN/failure-analysis.md

      - Re-spawn individual failed epics without re-running successful ones

      - Wave is NOT complete until N/N (100%)


      **OBSOLETE - DO NOT USE**:

      - Bob CLI invocation pattern (bob --yolo --chat-mode ...)

      - _pX_NNN.sh shell scripts

      - GCP VM screen sessions

      - gcp-vm-wave-execution skill for launching agents

      - 12-second delay between launches

      - Building-Blocks Method for script generation



      We are working on the vm.

      APIs are in @/docs/API, Rotate the APIs when launching waves, ex. 1 throgh
      15 then 1 through 15, and if any run out tell user which one in order to
      replace it for you.
    groups:
      - read
      - edit
      - execute
      - mcp
      - browser
      - subagents
      - skill
      - todo
      - subtask
      - subagent
      - mode
